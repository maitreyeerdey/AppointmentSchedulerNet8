name: Appointment Service

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR Login
        run: az acr login --name appointmentscheduleracr

      - name: Build Docker Image
        run: |
          docker build \
          -t appointmentscheduleracr.azurecr.io/appointmentservice:${{ github.sha }} \
          -f AppointmentScheduler.AppointmentService/Dockerfile .

      - name: Push Image
        run: |
          docker push appointmentscheduleracr.azurecr.io/appointmentservice:${{ github.sha }}

      - name: Update Container App
        run: |
          az containerapp update \
            --name appointmentservice \
            --resource-group VisualStudioOnline-FECBB64602464D1F90BA5DC5D1CA72B4 \
            --image appointmentscheduleracr.azurecr.io/appointmentservice:${{ github.sha }}
