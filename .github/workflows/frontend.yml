name: Frontend Build, Push and Deploy

on:
push:
branches:
- main

jobs:
build-and-deploy:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout source
    uses: actions/checkout@v4

  - name: Azure Login
    uses: azure/login@v2
    with:
      creds: ${{ secrets.AZURE_CREDENTIALS }}

  - name: Login to ACR
    run: az acr login --name appointmentscheduleracr

  - name: Set Image Tag
    run: echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

  - name: Build Docker image
    run: |
      docker build \
        -f frontend/Dockerfile \
        -t appointmentscheduleracr.azurecr.io/frontend:${IMAGE_TAG} \
        ./frontend

  - name: Push Docker image
    run: |
      docker push appointmentscheduleracr.azurecr.io/frontend:${IMAGE_TAG}

  - name: Update Frontend Container App
    run: |
      az containerapp update \
        --name appointmentschedulerfrontend \
        --resource-group VisualStudioOnline-FECBB64602464D1F90BA5DC5D1CA72B4 \
        --image appointmentscheduleracr.azurecr.io/frontend:${IMAGE_TAG}

  - name: Verify Revision
    run: |
      az containerapp revision list \
        --name appointmentschedulerfrontend \
        --resource-group VisualStudioOnline-FECBB64602464D1F90BA5DC5D1CA72B4 \
        --output table
```
